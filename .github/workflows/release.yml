# A version tag on main publishes the release and pushes the AUR package.

name: Release

on:
  push:
    tags: ['*']

permissions: {}

# Every step in bash with pipefail, as the Makefile runs its recipes.
defaults:
  run:
    shell: bash

# A tag's run is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag on main and its notes, or a failure before anything is published.
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - id: notes
        uses: murkl/workflows/notes@21fff230679db7d36e4b6a456297e7eabec34b73  # 1.0.0

  # The release with its notes and tarball, the AUR files for it, built once as
  # a user builds them, then pushed with a key only tags may use. A rerun does it
  # all again with the release and tarball already there.
  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    environment: aur
    permissions:
      contents: write  # the release and its tarball
    env:
      TAG: ${{ needs.release.outputs.version }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh github-cli plymouth

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes "$NOTES"

      # Packed once and kept on the release, so the sum in the AUR never changes.
      # makepkg takes it beside the PKGBUILD. The checkout belongs to the runner's
      # user, not root, so git is told to trust it for this one call.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar="plymouth-theme-arch-os-${VERSION}.tar.gz"
          mkdir aur-files
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -qxF "$tar" <<<"$assets"; then
            gh release download "$TAG" --pattern "$tar" --dir aur-files
          else
            git -c safe.directory="$PWD" archive --format=tar.gz --prefix="plymouth-theme-arch-os-${VERSION}/" -o "aur-files/${tar}" HEAD
            gh release upload "$TAG" "aur-files/${tar}"
          fi
          tools/aur.sh "$VERSION" "aur-files/${tar}" aur-files
          tools/aur-build.sh aur-files

      # The host key as https://aur.archlinux.org names its fingerprint.
      - env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::The environment aur has no secret AUR_SSH_KEY. tools/aur-key.sh sets it, then rerun this job."
            exit 1
          fi
          ssh="${RUNNER_TEMP}/ssh"
          install -d -m 700 "$ssh"
          printf '%s\n' "$AUR_SSH_KEY" >"${ssh}/key"
          chmod 600 "${ssh}/key"
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >"${ssh}/known_hosts"
          export GIT_SSH_COMMAND="ssh -i ${ssh}/key -o IdentitiesOnly=yes -o UserKnownHostsFile=${ssh}/known_hosts -o StrictHostKeyChecking=yes"
          tools/aur-push.sh aur-files
